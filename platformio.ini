[platformio]
default_envs = xiao_samd21

[env]
framework = arduino
monitor_speed = 420000
lib_archive = no

[env:xiao_samd21]
platform = atmelsam@8.1.0
platform_packages =
    platformio/framework-arduino-samd-seeed@1.8.1
board = seeed_xiao
build_flags =
    -D USE_TINYUSB
lib_deps =
    https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git#0.10.5
    cmaglie/FlashStorage
lib_ignore =
    USBHost

[env:xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
    -D USE_TINYUSB
lib_deps =
    adafruit/Adafruit TinyUSB Library@^3.7.3